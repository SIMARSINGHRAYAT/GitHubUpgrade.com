<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | GitHubUpgrade.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=3" />
  </head>
  <body class="auth-page">
    <div class="github-icons-bg" id="githubBg"></div>
    <main class="auth-view">
      <section class="auth-card" aria-labelledby="welcome-heading">
        <div class="key-box" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img"><circle cx="8.5" cy="8.5" r="3.25"></circle><path d="m11 11 8 8m-2-2 2-2m-5-1 2-2"></path></svg>
        </div>
        <h1 id="welcome-heading">SIGN IN</h1>
        <p class="auth-copy">Authenticate with your GitHub account to unlock commit scheduling and community support features.</p>
        <a class="github-button" href="/api/auth/login">
          <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1[...]"></path></svg>
          <span>GITHUB SIGN IN</span>
        </a>
        <a class="back-link" href="/">← BACK</a>
      </section>
    </main>
    <script>
      function createFallingIcons() {
        const bg = document.getElementById('githubBg');
        const iconCount = 12;
        const positions = [];
        
        for (let i = 0; i < iconCount; i++) {
          let xPos;
          let attempts = 0;
          let validPosition = false;
          
          while (!validPosition && attempts < 10) {
            xPos = Math.random() * 100;
            validPosition = true;
            for (let pos of positions) {
              if (Math.abs(xPos - pos) < 15) {
                validPosition = false;
                break;
              }
            }
            attempts++;
          }
          
          if (validPosition) {
            positions.push(xPos);
            const icon = document.createElement('div');
            icon.className = 'github-logo-fall';
            icon.innerHTML = `<svg viewBox="0 0 16 16" width="40" height="40" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>`;
            const duration = 2 + Math.random() * 3;
            const delay = Math.random() * 12;
            icon.style.left = xPos + '%';
            icon.style.animationDuration = duration + 's';
            icon.style.animationDelay = delay + 's';
            bg.appendChild(icon);
          }
        }
      }
      (async function redirectIfAlreadySignedIn() {
        try {
          const response = await fetch('/api/auth/status', { credentials: 'include' });
          const data = await response.json();
          if (response.ok && data && data.success) {
            window.location.replace('/social-actions.html');
          }
        } catch (error) {
          console.warn('[auth-page] Not authenticated yet.');
        }
        createFallingIcons();
      })();
    </script>
  </body>
</html>
