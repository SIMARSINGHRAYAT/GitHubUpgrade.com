<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | GitHubUpgrade.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=3" />
  </head>
  <body class="auth-page">
    <div class="github-icons-bg" id="githubBg"></div>
    <main class="auth-view">
      <section class="auth-card" aria-labelledby="welcome-heading">
        <div class="key-box" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img"><circle cx="8.5" cy="8.5" r="3.25"></circle><path d="m11 11 8 8m-2-2 2-2m-5-1 2-2"></path></svg>
        </div>
        <h1 id="welcome-heading">SIGN IN</h1>
        <p class="auth-copy">Authenticate with your GitHub account to unlock commit scheduling and community support features.</p>
        <a class="github-button" href="/api/auth/login">
          <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1[...]"></path></svg>
          <span>GITHUB SIGN IN</span>
        </a>
        <a class="back-link" href="/">← BACK</a>
      </section>
    </main>
    <script>
      function createFallingIcons() {
        const bg = document.getElementById('githubBg');
        const iconCount = 20;
        for (let i = 0; i < iconCount; i++) {
          const icon = document.createElement('div');
          icon.className = 'github-icon-fall';
          icon.textContent = '♦';
          const xPos = Math.random() * 100;
          const duration = 8 + Math.random() * 8;
          const delay = Math.random() * 10;
          icon.style.left = xPos + '%';
          icon.style.animationDuration = duration + 's';
          icon.style.animationDelay = delay + 's';
          bg.appendChild(icon);
        }
      }
      (async function redirectIfAlreadySignedIn() {
        try {
          const response = await fetch('/api/auth/status', { credentials: 'include' });
          const data = await response.json();
          if (response.ok && data && data.success) {
            console.log('[auth-page] User already authenticated; redirecting to social step.');
            window.location.replace('/social-actions.html');
          }
        } catch (error) {
          console.warn('[auth-page] Not authenticated yet.', error);
        }
        createFallingIcons();
      })();
    </script>
  </body>
</html>
