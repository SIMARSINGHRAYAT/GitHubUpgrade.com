<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Aboard | GitHubUpgrade.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=2" />
  </head>
  <body class="auth-page">
    <main class="auth-view">
      <section class="auth-card" aria-labelledby="welcome-heading">
        <div class="key-box" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img"><circle cx="8.5" cy="8.5" r="3.25"></circle><path d="m11 11 8 8m-2-2 2-2m-5-1 2-2"></path></svg>
        </div>
        <h1 id="welcome-heading">WELCOME ABOARD</h1>
        <p class="auth-copy">Sign in securely with GitHub OAuth. GitHubUpgrade.com never asks you to paste or manage a personal access token.</p>
        <a class="github-button" href="/api/auth/login">
          <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1[...]"></path></svg>
          <span>SIGN IN VIA GITHUB</span>
          <svg class="external-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5m0-5-7 7"></path><path d="M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></svg>
        </a>
        <a class="back-link" href="/">BACK TO WELCOME</a>
      </section>
    </main>
    <script>
      (async function redirectIfAlreadySignedIn() {
        try {
          const response = await fetch('/api/auth/status', { credentials: 'include' });
          const data = await response.json();
          if (response.ok && data && data.success) {
            console.log('[auth-page] User already authenticated; redirecting to social step.');
            window.location.replace('/social-actions.html');
          }
        } catch (error) {
          console.warn('[auth-page] Not authenticated yet.', error);
        }
      })();
    </script>
  </body>
</html>
