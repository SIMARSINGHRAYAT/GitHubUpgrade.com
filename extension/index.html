<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | GitHubUpgrade.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/extension/styles.css?v=5" />
  </head>
  <body>
    <div class="grid-overlay"></div>
    <div class="github-icons-bg" id="githubBg"></div>
    
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <h1 class="brand-name"><span class="chrome">GitHub</span>Upgrade<span class="green">.com</span></h1>
        </div>
        <div class="user-info">
          <span id="userSummary">Loading...</span>
          <button class="ghost-button" id="signOutBtn" type="button">LOGOUT</button>
        </div>
      </header>

      <main class="app-grid">
        <!-- Scheduler Section -->
        <section class="panel scheduler-panel" id="schedulerPanel">
          <div class="panel-header">
            <h2>SCHEDULE COMMITS</h2>
            <span class="status-pill" id="connectionStatus">
              <span class="pulse-dot"></span> Ready
            </span>
          </div>

          <form id="commitForm">
            <!-- Date Inputs -->
            <div class="field-grid two-col">
              <label>
                START DATE
                <div class="input-wrap">
                  <svg class="calendar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                  <input type="date" id="startDate" required />
                </div>
              </label>
              <label>
                END DATE
                <div class="input-wrap">
                  <svg class="calendar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                  <input type="date" id="endDate" required />
                </div>
              </label>
            </div>

            <!-- Repository Inputs -->
            <div class="field-grid two-col">
              <label>
                REPOSITORY OWNER
                <div class="input-wrap">
                  <input type="text" id="repoOwner" placeholder="username" required />
                </div>
              </label>
              <label>
                REPOSITORY
                <div class="input-wrap">
                  <select id="repoName" required>
                    <option value="" disabled selected>Loading...</option>
                  </select>
                </div>
              </label>
            </div>

            <!-- Branch Input -->
            <label class="field-grid full">
              TARGET BRANCH
              <div class="input-wrap">
                <input type="text" id="branch" value="main" required />
              </div>
            </label>

            <!-- Filter Section -->
            <!-- Weekday Table - Always Visible -->
            <div class="weekday-table-section">
              <label>COMMITS PER WEEKDAY</label>
              <div class="day-grid">
                <div class="mini-input"><span>MON</span><input type="number" min="0" max="5" value="5" data-weekday="monday" /></div>
                <div class="mini-input"><span>TUE</span><input type="number" min="0" max="5" value="5" data-weekday="tuesday" /></div>
                <div class="mini-input"><span>WED</span><input type="number" min="0" max="5" value="5" data-weekday="wednesday" /></div>
                <div class="mini-input"><span>THU</span><input type="number" min="0" max="5" value="5" data-weekday="thursday" /></div>
                <div class="mini-input"><span>FRI</span><input type="number" min="0" max="5" value="5" data-weekday="friday" /></div>
                <div class="mini-input"><span>SAT</span><input type="number" min="0" max="5" value="0" data-weekday="saturday" /></div>
                <div class="mini-input"><span>SUN</span><input type="number" min="0" max="5" value="0" data-weekday="sunday" /></div>
              </div>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
              <label>QUICK FILTERS</label>
              <div class="filter-buttons">
                <button type="button" class="filter-btn active" data-filter="all">ALL DAYS</button>
                <button type="button" class="filter-btn" data-filter="even">EVEN DAYS</button>
                <button type="button" class="filter-btn" data-filter="odd">ODD DAYS</button>
                <button type="button" class="filter-btn" data-filter="custom">RANDOM</button>
              </div>

              <!-- Min/Max Options -->
              <div id="filterOptions" class="filter-buttons" style="margin-top: 12px;">
                <button type="button" class="filter-btn active" data-option="min">MIN (1)</button>
                <button type="button" class="filter-btn" data-option="max">MAX (5)</button>
              </div>
            </div>

            <!-- Push Toggle -->
            <div class="toggles">
              <label class="toggle-switch-label">
                <div class="toggle-switch">
                  <input type="checkbox" id="pushToRemote" checked />
                  <span class="slider"></span>
                </div>
                <span>PUSH TO REMOTE</span>
              </label>
            </div>

            <!-- Generate Button -->
            <button type="submit" class="primary-button" id="submitBtn">
              GENERATE SCHEDULE
            </button>
          </form>

          <!-- Result Panel -->
          <div id="result" class="result hidden"></div>
        </section>
      </main>
    </div>

    <script src="/extension/script.js?v=5"></script>
    <script>
      function createFallingIcons() {
        const bg = document.getElementById('githubBg');
        const iconCount = 12;
        const positions = [];
        
        for (let i = 0; i < iconCount; i++) {
          let xPos;
          let attempts = 0;
          let validPosition = false;
          
          while (!validPosition && attempts < 10) {
            xPos = Math.random() * 100;
            validPosition = true;
            for (let pos of positions) {
              if (Math.abs(xPos - pos) < 15) {
                validPosition = false;
                break;
              }
            }
            attempts++;
          }
          
          if (validPosition) {
            positions.push(xPos);
            const icon = document.createElement('div');
            icon.className = 'github-logo-fall';
            icon.innerHTML = `<svg viewBox="0 0 16 16" width="40" height="40" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>`;
            const duration = 2 + Math.random() * 3;
            const delay = Math.random() * 12;
            icon.style.left = xPos + '%';
            icon.style.animationDuration = duration + 's';
            icon.style.animationDelay = delay + 's';
            bg.appendChild(icon);
          }
        }
      }
      createFallingIcons();
    </script>
  </body>
</html>
