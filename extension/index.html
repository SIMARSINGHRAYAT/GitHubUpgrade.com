<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | GitHubUpgrade.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/extension/styles.css?v=5" />
  </head>
  <body>
    <div class="grid-overlay"></div>
    <div class="github-icons-bg" id="githubBg"></div>
    
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <h1 class="brand-name"><span class="chrome">GitHub</span>Upgrade<span class="green">.com</span></h1>
        </div>
        <div class="user-info">
          <span id="userSummary">Loading...</span>
          <button class="ghost-button" id="signOutBtn" type="button">LOGOUT</button>
        </div>
      </header>

      <main class="app-grid">
        <!-- Scheduler Section -->
        <section class="panel scheduler-panel" id="schedulerPanel">
          <div class="panel-header">
            <h2>SCHEDULE COMMITS</h2>
            <span class="status-pill" id="connectionStatus">
              <span class="pulse-dot"></span> Ready
            </span>
          </div>

          <form id="commitForm">
            <!-- Date Inputs -->
            <div class="field-grid two-col">
              <label>
                START DATE
                <div class="input-wrap">
                  <input type="date" id="startDate" required />
                </div>
              </label>
              <label>
                END DATE
                <div class="input-wrap">
                  <input type="date" id="endDate" required />
                </div>
              </label>
            </div>

            <!-- Repository Inputs -->
            <div class="field-grid two-col">
              <label>
                REPOSITORY OWNER
                <div class="input-wrap">
                  <input type="text" id="repoOwner" placeholder="username" required />
                </div>
              </label>
              <label>
                REPOSITORY
                <div class="input-wrap">
                  <select id="repoName" required>
                    <option value="" disabled selected>Loading...</option>
                  </select>
                </div>
              </label>
            </div>

            <!-- Branch Input -->
            <label class="field-grid full">
              TARGET BRANCH
              <div class="input-wrap">
                <input type="text" id="branch" value="main" required />
              </div>
            </label>

            <!-- Filter Section -->
            <div class="filter-section">
              <label>COMMIT FILTER MODE</label>
              <div class="filter-buttons">
                <button type="button" class="filter-btn active" data-filter="all">ALL DAYS</button>
                <button type="button" class="filter-btn" data-filter="even">EVEN DAYS</button>
                <button type="button" class="filter-btn" data-filter="odd">ODD DAYS</button>
                <button type="button" class="filter-btn" data-filter="custom">CUSTOM</button>
              </div>

              <!-- Min/Max/Random Options -->
              <div id="filterOptions" class="filter-buttons">
                <button type="button" class="filter-btn" data-option="min">MIN (1)</button>
                <button type="button" class="filter-btn" data-option="max">MAX (20)</button>
                <button type="button" class="filter-btn" id="randomBtn" data-option="random" style="display:none;">RANDOM</button>
              </div>
            </div>

            <!-- Custom Weekday Controls (shown when custom is selected) -->
            <div id="customWeekdaySection" style="display:none;">
              <label>COMMITS PER WEEKDAY</label>
              <div class="day-grid">
                <div class="mini-input"><span>M</span><input type="number" min="0" max="50" value="5" data-weekday="monday" /></div>
                <div class="mini-input"><span>T</span><input type="number" min="0" max="50" value="5" data-weekday="tuesday" /></div>
                <div class="mini-input"><span>W</span><input type="number" min="0" max="50" value="5" data-weekday="wednesday" /></div>
                <div class="mini-input"><span>T</span><input type="number" min="0" max="50" value="5" data-weekday="thursday" /></div>
                <div class="mini-input"><span>F</span><input type="number" min="0" max="50" value="5" data-weekday="friday" /></div>
                <div class="mini-input"><span>S</span><input type="number" min="0" max="50" value="0" data-weekday="saturday" /></div>
                <div class="mini-input"><span>S</span><input type="number" min="0" max="50" value="0" data-weekday="sunday" /></div>
              </div>
            </div>

            <!-- Push Toggle -->
            <div class="toggles">
              <label class="toggle-switch-label">
                <div class="toggle-switch">
                  <input type="checkbox" id="pushToRemote" checked />
                  <span class="slider"></span>
                </div>
                <span>PUSH TO REMOTE</span>
              </label>
            </div>

            <!-- Generate Button -->
            <button type="submit" class="primary-button" id="submitBtn">
              GENERATE SCHEDULE
            </button>
          </form>

          <!-- Result Panel -->
          <div id="result" class="result hidden"></div>
        </section>
      </main>
    </div>

    <script src="/extension/script.js?v=5"></script>
    <script>
      function createFallingIcons() {
        const bg = document.getElementById('githubBg');
        const iconCount = 15;
        for (let i = 0; i < iconCount; i++) {
          const icon = document.createElement('div');
          icon.className = 'github-icon-fall';
          icon.textContent = '♦';
          const xPos = Math.random() * 100;
          const duration = 10 + Math.random() * 10;
          const delay = Math.random() * 15;
          icon.style.left = xPos + '%';
          icon.style.animationDuration = duration + 's';
          icon.style.animationDelay = delay + 's';
          bg.appendChild(icon);
        }
      }
      createFallingIcons();
    </script>
  </body>
</html>
