<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support the Project | GitHubUpgrade.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=3" />
  </head>
  <body class="social-page">
    <div class="github-icons-bg" id="githubBg"></div>
    <main class="social-view">
      <section class="social-card" aria-labelledby="social-heading">
        <p class="social-eyebrow">SUPPORT</p>
        <h1 id="social-heading">Support the Project</h1>
        <p class="social-copy">Help us grow the community! Star our repository and follow the maintainer to show your support.</p>
        <div class="social-actions">
          <button class="social-action" type="button" data-action="star"><span class="action-mark">⭐</span><span><strong>Star the repository</strong><small id="starStatus">Show appreciation</small></span><span class="action-state" aria-hidden="true">→</span></button>
          <button class="social-action" type="button" data-action="follow"><span class="action-mark">👤</span><span><strong>Follow the maintainer</strong><small id="followStatus">Stay updated</small></span><span class="action-state" aria-hidden="true">→</span></button>
        </div>
        <p id="socialStatus" class="social-status" aria-live="polite"></p>
        <button id="continueBtn" class="continue-button" type="button" disabled>CONTINUE TO DASHBOARD</button>
        <a class="social-back" href="/auth.html">← SIGN OUT</a>
      </section>
    </main>
    <script>
      function createFallingIcons() {
        const bg = document.getElementById('githubBg');
        const iconCount = 12;
        const positions = [];
        
        for (let i = 0; i < iconCount; i++) {
          let xPos;
          let attempts = 0;
          let validPosition = false;
          
          while (!validPosition && attempts < 10) {
            xPos = Math.random() * 100;
            validPosition = true;
            for (let pos of positions) {
              if (Math.abs(xPos - pos) < 15) {
                validPosition = false;
                break;
              }
            }
            attempts++;
          }
          
          if (validPosition) {
            positions.push(xPos);
            const icon = document.createElement('div');
            icon.className = 'github-logo-fall';
            icon.innerHTML = `<svg viewBox="0 0 16 16" width="40" height="40" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>`;
            const duration = 5 + Math.random() * 8;
            const delay = Math.random() * 12;
            icon.style.left = xPos + '%';
            icon.style.animationDuration = duration + 's';
            icon.style.animationDelay = delay + 's';
            bg.appendChild(icon);
          }
        }
      }

      (async function ensureAuthenticated() {
        try {
          const response = await fetch('/api/auth/status', { credentials: 'include' });
          const data = await response.json();
          if (!response.ok || !data || !data.success) {
            window.location.replace('/auth.html');
          }
        } catch (error) {
          window.location.replace('/auth.html');
        }
        createFallingIcons();
      })();

      const completed = new Set();
      const status = document.getElementById('socialStatus');
      const continueButton = document.getElementById('continueBtn');
      const labels = { star: 'starStatus', follow: 'followStatus' };
      document.querySelectorAll('.social-action').forEach((button) => {
        button.addEventListener('click', async () => {
          const action = button.dataset.action;
          if (completed.has(action)) return;
          button.disabled = true;
          status.textContent = 'Updating your GitHub account...';
          try {
            const response = await fetch('/api/social-actions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }), credentials: 'include' });
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error(data.message || 'GitHub could not complete this action.');
            completed.add(action);
            document.getElementById(labels[action]).textContent = 'Completed!';
            button.classList.add('completed');
            button.querySelector('.action-state').textContent = '✓';
            status.textContent = completed.size === 2 ? 'All actions complete! Ready to continue.' : '1 of 2 complete. Choose one more.';
            continueButton.disabled = completed.size !== 2;
          } catch (error) {
            button.disabled = false;
            status.textContent = error.message;
          }
        });
      });
      continueButton.addEventListener('click', () => { window.location.href = '/extension/index.html'; });
    </script>
  </body>
</html>
